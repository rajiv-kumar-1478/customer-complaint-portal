<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Tejas Indane</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="admin-body">
    <!-- Login Section -->
    <div id="loginSection" class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <img src="assets/indian_oil_logo.png" alt="Indian Oil Logo" style="height: 60px; margin-bottom: 15px;">
                <h2 style="font-family: 'Outfit'; color: var(--secondary);">Admin Login</h2>
                <p style="color: var(--text-muted);">Access the complaint management system</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="Enter admin username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary"
                    style="width: 100%; justify-content: center; margin-top: 10px;">
                    Login to Dashboard
                </button>
            </form>
            <p id="loginError"
                style="color: var(--danger); text-align: center; margin-top: 15px; font-size: 0.9rem; display: none;">
            </p>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" style="display: none;">
        <header class="admin-header">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <img src="assets/indian_oil_logo.png" alt="Indian Oil Logo" style="height: 35px;">
                    <h1 style="font-size: 1.5rem; letter-spacing: -0.5px;">ADMIN PANEL</h1>
                </div>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <span id="adminName" style="font-weight: 500; font-size: 0.9rem;"></span>
                    <button id="logoutBtn" class="btn-primary"
                        style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Complaints</h3>
                    <div id="totalCount" class="value">0</div>
                </div>
                <div class="stat-card">
                    <h3>Pending Tasks</h3>
                    <div id="pendingCount" class="value" style="color: var(--primary);">0</div>
                </div>
                <div class="stat-card">
                    <h3>Resolved</h3>
                    <div id="resolvedCount" class="value" style="color: var(--success);">0</div>
                </div>
            </div>

            <div class="table-container">
                <div
                    style="padding: 20px; border-bottom: 1px solid #EEE; display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-size: 1.2rem;">Recent Complaints</h2>
                    <button id="refreshBtn"
                        style="background: none; border: none; color: var(--primary); cursor: pointer; font-weight: 600;">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="complaintsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Customer Info</th>
                                <th>Type</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="complaintsList">
                            <!-- Data will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Complaint Details Modal -->
    <div id="detailsModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <h2 style="font-family: 'Outfit'; color: var(--secondary);"><i class="fas fa-info-circle"></i> Complaint
                    Details</h2>
                <span class="close-modal" onclick="closeModal()"
                    style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div id="modalBody" class="modal-body">
                <!-- Details will be loaded here -->
            </div>
            <hr style="margin: 24px 0; border: 0; border-top: 1px solid #EEE;">
            <div class="whatsapp-section">
                <h3><i class="fab fa-whatsapp"></i> Send Update to Customer</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">Type a message to send via
                    WhatsApp</p>
                <textarea id="whatsappMessage" rows="3" placeholder="Hello, your complaint regarding..."
                    style="width: 100%; padding: 12px; border-radius: 8px; border: 1.5px solid #EAEAEA; margin-bottom: 12px;"></textarea>
                <button id="sendWhatsAppBtn" class="btn-primary"
                    style="background: #25D366; width: 100%; justify-content: center;">
                    <i class="fab fa-whatsapp"></i> Send via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .detail-item {
            margin-bottom: 16px;
        }

        .detail-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 1rem;
            color: var(--secondary);
            font-weight: 500;
        }
    </style>

    <script src="admin-script.js"></script>
</body>

</html>
