services:
  # Flask Backend Service
  - type: web
    name: tejas-indane-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: JWT_SECRET_KEY
        value: tejas-indane-secret-key-change-me

  # Frontend Static Site
  - type: web
    name: tejaslpg
    runtime: static
    staticPublishPath: frontend
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
